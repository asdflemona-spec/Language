name: Build XiaoLiao APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "XiaoLiao-Android.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract Android project
        run: |
          mkdir -p extracted
          unzip -q XiaoLiao-Android.zip -d extracted
          echo "=== ZIP contents ==="
          find extracted -maxdepth 3 -type f | sort | head -100

      - name: Find project root
        shell: bash
        run: |
          GRADLEW=$(find extracted -type f -name gradlew | head -1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found inside ZIP"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Make Gradle executable
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Locate APK
        shell: bash
        run: |
          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f -name "*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not generated"
            exit 1
          fi

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "Generated: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XiaoLiao-debug-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
